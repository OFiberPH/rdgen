name: OFIBER Release Builder
run-name: OFIBER Release - ${{ inputs.config }} v${{ inputs.version }}

# Offline release pipeline: builds branded RustDesk clients for the committed
# OFIBER configs (.github/release-configs/<config>) across every OS and
# publishes them as a single GitHub Release, without needing the live RDGen web
# service or any repo secret. Build inputs are produced in-CI by
# .github/scripts/make_secrets_zip.py (identical to what the web service would
# dispatch) and handed to the existing generator-* workflows in release_mode.
# All selected platform builds run in parallel; run this workflow once per
# config (OFIBER and OFIBER_client) to build both at the same time.

on:
  workflow_dispatch:
    inputs:
      config:
        description: 'Which committed config to build'
        type: choice
        options:
          - OFIBER
          - OFIBER_client
        default: OFIBER
      version:
        description: 'RustDesk version to build'
        type: string
        default: '1.4.9'
      windows:
        description: 'Build Windows x64'
        type: boolean
        default: true
      windows_x86:
        description: 'Build Windows 32-bit (x86)'
        type: boolean
        default: true
      linux:
        description: 'Build Linux (deb/rpm/pkg + AppImage + Flatpak)'
        type: boolean
        default: true
      macos:
        description: 'Build macOS (.dmg)'
        type: boolean
        default: true
      android:
        description: 'Build Android (.apk)'
        type: boolean
        default: true
      dry_run:
        description: 'Only prepare + validate build inputs, skip the long builds'
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

# Not a secret: the encrypted secrets bundle only exists as a 1-day run
# artifact, and its contents (server/key/permanent password) already ship inside
# every generated client. The password just satisfies the decrypt-secrets format.
env:
  RELEASE_ZIP_PW: rdgen-offline-release

jobs:
  prepare:
    name: Prepare build inputs
    runs-on: ubuntu-latest
    outputs:
      filename: ${{ steps.prep.outputs.filename }}
      appname: ${{ steps.prep.outputs.appname }}
      uuid: ${{ steps.prep.outputs.uuid }}
      version: ${{ steps.prep.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pyzipper
        run: pip install pyzipper

      - name: Build encrypted secrets bundle + PNGs
        id: prep
        run: |
          python3 .github/scripts/make_secrets_zip.py \
            --config-name "${{ inputs.config }}" \
            --version "${{ inputs.version }}" \
            --zip-password "$RELEASE_ZIP_PW" \
            --out-zip secrets.zip \
            --png-dir release-pngs \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload encrypted secrets artifact
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-secrets-zip
          path: secrets.zip
          retention-days: 1
          if-no-files-found: error

      - name: Upload release PNGs artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-pngs
          path: release-pngs/*
          retention-days: 1
          if-no-files-found: error

  build-windows:
    name: Windows x64
    needs: prepare
    if: ${{ inputs.windows && !inputs.dry_run }}
    uses: ./.github/workflows/generator-windows.yml
    with:
      version: ${{ inputs.version }}
      release_mode: true
      config_name: ${{ inputs.config }}
      release_zip_pw: rdgen-offline-release
    secrets: inherit

  build-windows-x86:
    name: Windows x86
    needs: prepare
    if: ${{ inputs.windows_x86 && !inputs.dry_run }}
    uses: ./.github/workflows/generator-windows-x86.yml
    with:
      version: ${{ inputs.version }}
      release_mode: true
      config_name: ${{ inputs.config }}
      release_zip_pw: rdgen-offline-release
    secrets: inherit

  build-linux:
    name: Linux
    needs: prepare
    if: ${{ inputs.linux && !inputs.dry_run }}
    uses: ./.github/workflows/generator-linux.yml
    with:
      version: ${{ inputs.version }}
      release_mode: true
      config_name: ${{ inputs.config }}
      release_zip_pw: rdgen-offline-release
    secrets: inherit

  build-macos:
    name: macOS
    needs: prepare
    if: ${{ inputs.macos && !inputs.dry_run }}
    uses: ./.github/workflows/generator-macos.yml
    with:
      version: ${{ inputs.version }}
      release_mode: true
      config_name: ${{ inputs.config }}
      release_zip_pw: rdgen-offline-release
    secrets: inherit

  build-android:
    name: Android
    needs: prepare
    if: ${{ inputs.android && !inputs.dry_run }}
    uses: ./.github/workflows/generator-android.yml
    with:
      version: ${{ inputs.version }}
      release_mode: true
      config_name: ${{ inputs.config }}
      release_zip_pw: rdgen-offline-release
    secrets: inherit

  publish:
    name: Publish GitHub Release
    needs: [prepare, build-windows, build-windows-x86, build-linux, build-macos, build-android]
    if: >-
      ${{ !inputs.dry_run && !cancelled() && (
        needs.build-windows.result == 'success' ||
        needs.build-windows-x86.result == 'success' ||
        needs.build-linux.result == 'success' ||
        needs.build-macos.result == 'success' ||
        needs.build-android.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          pattern: ofiber-build-*
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: |
          echo "Collected release files:"
          find dist -type f -printf '  %p (%s bytes)\n' || true
          if [ -z "$(find dist -type f 2>/dev/null)" ]; then
            echo "::error::No build artifacts were produced."
            exit 1
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.config }}-v${{ inputs.version }}-build${{ github.run_number }}
          name: ${{ needs.prepare.outputs.appname }} v${{ inputs.version }} (build ${{ github.run_number }})
          body: |
            Custom RustDesk clients generated from `.github/release-configs/${{ inputs.config }}`.

            - Config: `${{ inputs.config }}`
            - App name: `${{ needs.prepare.outputs.appname }}`
            - Base file name: `${{ needs.prepare.outputs.filename }}`
            - RustDesk version: `${{ inputs.version }}`

            Built by the OFIBER Release Builder workflow (offline, no RDGen web service).
            Some platforms build several package formats (Linux: deb/rpm/pkg + AppImage + Flatpak).
          files: dist/**
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
